name: Build and deploy Node.js app to Azure Web App - rahul-app

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: "Deploy to Azure after confirming the Azure service-principal secrets are valid"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install, build and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Validate Azure deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6B5C0216C8CA4973B55E530C1B98EC71 }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_AA6D9C48888D471AB51791FA91C06CA3 }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_52F6631C37014CE28318C9ECA27C8DCF }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID" || { echo "::error::Azure client ID secret is missing."; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "::error::Azure tenant ID secret is missing."; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "::error::Azure subscription ID secret is missing."; exit 1; }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6B5C0216C8CA4973B55E530C1B98EC71 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AA6D9C48888D471AB51791FA91C06CA3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_52F6631C37014CE28318C9ECA27C8DCF }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: rahul-app
          slot-name: Production
          package: .
